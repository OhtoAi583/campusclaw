# web 服务只做两件事：托管前端构建产物、把 /api 反代给 api。
# 注意：上传目录不在这里暴露，材料文件只能经鉴权接口读取。
upstream campusclaw_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限与后端 MAX_UPLOAD_BYTES 保持一致（略大一点给 multipart 表单留余量）。
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json;
    gzip_min_length 512;

    location /api/ {
        proxy_pass http://campusclaw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 存活探针同样经反代，保证 README 里的 /health 在只有一个对外端口时也可用。
    location = /health {
        proxy_pass http://campusclaw_api/health;
        proxy_set_header Host $host;
    }

    # 前端 SPA：静态资源优先，其余路径回落到 index.html。
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 显式关闭任何试图把上传目录当静态站点的请求。
    location /uploads/ {
        return 404;
    }
}
