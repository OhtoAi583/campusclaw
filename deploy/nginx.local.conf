# 本机裸机验证用配置：规则与容器内的 deploy/nginx.conf 一致，
# 只有监听端口、静态目录与上游地址改成本机地址（容器内是 web/api/db 三个服务）。
worker_processes 1;
error_log /Users/ohtoai583/project/campusclaw/logs/nginx-error.log warn;
pid       /Users/ohtoai583/project/campusclaw/logs/nginx.pid;

events { worker_connections 128; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /Users/ohtoai583/project/campusclaw/logs/nginx-access.log;
    client_max_body_size 4m;

    upstream campusclaw_api { server 127.0.0.1:8080; }

    server {
        listen      8088;
        server_name localhost;

        location /api/ {
            proxy_pass http://campusclaw_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /health {
            proxy_pass http://campusclaw_api/health;
            proxy_set_header Host $host;
        }

        location / {
            root /Users/ohtoai583/project/campusclaw/frontend/dist;
            try_files $uri $uri/ /index.html;
        }

        # 上传目录绝不作为静态目录暴露：材料文件只能经鉴权接口读取。
        location /uploads/ {
            return 404;
        }
    }
}
